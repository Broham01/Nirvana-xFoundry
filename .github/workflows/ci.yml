name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - run: pip install -e '.[test]'
      - run: pytest -q
      - run: shellcheck -S warning platform/dev/*.sh
      - run: xfoundry validate examples/edge-lab.yaml && xfoundry render examples/edge-lab.yaml > /dev/null
