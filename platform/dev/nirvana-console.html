<!doctype html>
<!-- A VM console with the two things the stock noVNC page lacks for labs (xStage ADR 0022): typing pasted text as
     keystrokes, which works at a login prompt or installer where no clipboard sync exists, and one-click Ctrl+Alt+Del.
     Served next to noVNC by console.sh; same view-only proxy, same URL parameters as vnc.html (path=…). -->
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>VM console</title>
<style>
  html,body{margin:0;height:100%;background:#0e0e10;color:#e8e6e3;font:13px/1.4 system-ui,-apple-system,sans-serif}
  #bar{display:flex;gap:8px;align-items:center;padding:6px 10px;background:#18181b;border-bottom:1px solid #2a2a2e}
  #bar button{background:#232327;color:inherit;border:1px solid #34343a;border-radius:6px;padding:4px 10px;font:inherit;cursor:pointer}
  #bar button:hover{border-color:#55555c} #bar button:disabled{opacity:.45;cursor:default}
  #state{margin-left:auto;color:#a1a1aa} #screen{position:absolute;top:39px;left:0;right:0;bottom:0}
  #paste{position:absolute;top:44px;left:10px;width:min(520px,calc(100% - 20px));background:#18181b;border:1px solid #34343a;border-radius:8px;padding:10px;display:none;z-index:2}
  #paste textarea{width:100%;box-sizing:border-box;height:120px;background:#0e0e10;color:inherit;border:1px solid #34343a;border-radius:6px;font:12px ui-monospace,monospace;padding:6px}
  #paste p{margin:6px 0;color:#a1a1aa} #paste .row{display:flex;gap:8px;justify-content:flex-end}
</style></head>
<body>
<div id="bar">
  <button id="cad" disabled title="Send Ctrl+Alt+Del to the VM">Ctrl+Alt+Del</button>
  <button id="openPaste" disabled title="Type text into the VM as keystrokes">Paste as typing</button>
  <span id="state">Connecting…</span>
</div>
<div id="paste">
  <textarea id="text" spellcheck="false" placeholder="Text to type into the VM"></textarea>
  <p>Typed with a US keyboard layout, one key at a time. Characters a US keyboard cannot type are skipped.</p>
  <div class="row"><button id="cancel">Cancel</button><button id="type">Type it</button></div>
</div>
<div id="screen"></div>
<script type="module">
import RFB from './core/rfb.js';
const q = new URLSearchParams(location.search), state = document.getElementById('state');
const url = `${location.protocol === 'https:' ? 'wss' : 'ws'}://${location.host}/${(q.get('path') || '').replace(/^\//, '')}`;
const rfb = new RFB(document.getElementById('screen'), url);
rfb.scaleViewport = true; rfb.focusOnClick = true;
const buttons = ['cad', 'openPaste'].map(id => document.getElementById(id));
rfb.addEventListener('connect', () => { state.textContent = 'Connected'; buttons.forEach(b => b.disabled = false); });
rfb.addEventListener('disconnect', e => { state.textContent = e.detail.clean ? 'Disconnected' : 'Connection lost. Reload to try again.'; buttons.forEach(b => b.disabled = true); });
document.getElementById('cad').onclick = () => { rfb.sendCtrlAltDel(); rfb.focus(); };

// US layout: KeyboardEvent.code and whether Shift is held. The code goes to QEMU as a scancode, so Shift is sent explicitly.
const SHIFTED = {'~':'`','!':'1','@':'2','#':'3','$':'4','%':'5','^':'6','&':'7','*':'8','(':'9',')':'0','_':'-','+':'=','{':'[','}':']','|':'\\',':':';','"':"'",'<':',','>':'.','?':'/'};
const CODES = {'`':'Backquote','-':'Minus','=':'Equal','[':'BracketLeft',']':'BracketRight','\\':'Backslash',';':'Semicolon',"'":'Quote',',':'Comma','.':'Period','/':'Slash',' ':'Space','\n':'Enter','\t':'Tab'};
const SPECIAL = {'\n': 0xff0d, '\t': 0xff09};
function key(ch) {
  let shift = false, base = ch;
  if (/[A-Z]/.test(ch)) { shift = true; base = ch.toLowerCase(); }
  else if (SHIFTED[ch]) { shift = true; base = SHIFTED[ch]; }
  const code = /[a-z]/.test(base) ? 'Key' + base.toUpperCase() : /[0-9]/.test(base) ? 'Digit' + base : CODES[base];
  return code ? { code, shift, keysym: SPECIAL[ch] || ch.charCodeAt(0) } : null;
}
const wait = ms => new Promise(r => setTimeout(r, ms));
async function typeText(text) {
  const keys = [...text.replace(/\r\n?/g, '\n')].map(key).filter(Boolean);
  for (let i = 0; i < keys.length; i++) {
    const k = keys[i];
    if (k.shift) rfb.sendKey(0xffe1, 'ShiftLeft', true);
    rfb.sendKey(k.keysym, k.code, true); rfb.sendKey(k.keysym, k.code, false);
    if (k.shift) rfb.sendKey(0xffe1, 'ShiftLeft', false);
    state.textContent = `Typing ${i + 1} of ${keys.length}…`;
    await wait(12);
  }
  state.textContent = 'Connected';
}
const panel = document.getElementById('paste'), text = document.getElementById('text');
document.getElementById('openPaste').onclick = async () => {
  panel.style.display = 'block';
  try { if (!text.value) text.value = await navigator.clipboard.readText(); } catch { /* the browser may refuse; type or paste into the box */ }
  text.focus();
};
document.getElementById('cancel').onclick = () => { panel.style.display = 'none'; rfb.focus(); };
document.getElementById('type').onclick = async () => { const t = text.value; panel.style.display = 'none'; text.value = ''; rfb.focus(); await typeText(t); };
</script>
</body></html>
